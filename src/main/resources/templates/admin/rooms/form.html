<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Cấu hình phòng chiếu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 680px">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="cinema-card">
        <div class="cinema-card-header">
            <h5 class="mb-0 fw-bold" th:text="${form.roomId == null} ? '🎬 Thêm phòng chiếu mới' : '🎬 Chỉnh sửa phòng chiếu'"></h5>
        </div>
        <div class="cinema-card-body">
            <form method="post" th:object="${form}" novalidate class="row g-3"
                  th:action="${form.roomId == null} ? @{/admin/rooms/new} : @{/admin/rooms/{id}/edit(id=${form.roomId})}">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Tên phòng <span class="text-danger">*</span></label>
                    <input class="form-control" placeholder="Ví dụ: Room 01, IMAX Laser..." th:field="*{roomName}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{roomName}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Loại phòng <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{roomType}" th:errorclass="is-invalid">
                        <option value="">-- Chọn định dạng phòng --</option>
                        <option th:each="t : ${roomTypes}" th:value="${t}" th:text="${t.label}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{roomType}"></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Số hàng (A–Z) <span class="text-danger">*</span></label>
                    <input type="number" min="1" max="26" class="form-control" th:field="*{totalRows}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{totalRows}"></div>
                    <small class="text-muted">Từ 1 đến 26 hàng</small>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Ghế mỗi hàng <span class="text-danger">*</span></label>
                    <input type="number" min="1" max="30" class="form-control" th:field="*{seatsPerRow}" th:errorclass="is-invalid">
                    <div class="invalid-feedback" th:errors="*{seatsPerRow}"></div>
                    <small class="text-muted">Từ 1 đến 30 ghế</small>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Trạng thái</label>
                    <select class="form-select" th:field="*{status}">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                    </select>
                </div>
                <div class="col-12 mt-4 pt-2 border-top d-flex gap-2">
                    <button class="btn btn-primary px-4 fw-bold">Lưu phòng chiếu</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/rooms}">Huỷ bỏ</a>
                </div>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
