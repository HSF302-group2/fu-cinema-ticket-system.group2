<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Quản lý đơn đặt vé')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Bộ lọc đơn đặt vé -->
    <div class="cinema-card mb-3">
        <div class="cinema-card-body p-3">
            <form class="row g-2 align-items-center" method="get" th:action="@{/admin/bookings}">
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1">Trạng thái:</label>
                    <select class="form-select form-select-sm" name="status">
                        <option value="">Tất cả</option>
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s == status}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1">Từ ngày:</label>
                    <input type="date" class="form-control form-control-sm" name="from" th:value="${from}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1">Đến ngày:</label>
                    <input type="date" class="form-control form-control-sm" name="to" th:value="${to}">
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted mb-1">Tìm khách hàng:</label>
                    <input class="form-control form-control-sm" name="kw" th:value="${kw}" placeholder="Tên, email, số điện thoại...">
                </div>
                <div class="col-md-2 mt-auto">
                    <button class="btn btn-primary btn-sm w-100 fw-bold">🔍 Lọc đơn vé</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bảng danh sách đơn vé -->
    <div class="cinema-card">
        <div class="cinema-card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold">🎟️ Danh sách đơn đặt vé</h5>
        </div>
        <div class="cinema-card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">Mã đơn</th>
                        <th>Ngày đặt</th>
                        <th>Khách hàng</th>
                        <th>Phim</th>
                        <th>Suất chiếu</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-3">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${bookings.empty}">
                        <td colspan="8" class="text-center py-4 text-muted">Không tìm thấy đơn đặt vé nào.</td>
                    </tr>
                    <tr th:each="b : ${bookings.content}">
                        <td class="ps-3 fw-bold text-primary" th:text="|#${b.bookingId}|"></td>
                        <td class="small" th:text="${#temporals.format(b.bookingDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <strong th:text="${b.customer.fullName}"></strong>
                            <div class="small text-muted" th:text="${b.customer.mobile}"></div>
                        </td>
                        <td th:text="${b.showtime.movie.title}"></td>
                        <td class="small" th:text="|${#temporals.format(b.showtime.startTime, 'dd/MM HH:mm')} · ${b.showtime.room.roomName}|"></td>
                        <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                        <td>
                            <span class="badge" th:classappend="|badge-status-${b.status}|" th:text="${b.status}"></span>
                        </td>
                        <td class="text-end pe-3">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/bookings/{id}(id=${b.bookingId})}">
                                Xem chi tiết
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/layout :: pagination(${bookings}, ${pageUrl})}"></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
