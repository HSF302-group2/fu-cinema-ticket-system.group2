<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Chi tiết vé xem phim')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 680px">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="e-ticket">
        <div class="e-ticket-header d-flex justify-content-between align-items-center flex-wrap">
            <div>
                <span class="badge bg-dark mb-1">FU CINEMA TICKET</span>
                <h4 class="mb-0 fw-bold text-primary" th:text="|Đơn vé #${booking.bookingId}|"></h4>
            </div>
            <div>
                <span class="badge fs-6" th:classappend="|badge-status-${booking.status}|" th:text="${booking.status}"></span>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-12">
                <label class="text-muted small">Phim</label>
                <div class="h5 fw-bold text-dark mb-0" th:text="${booking.showtime.movie.title}"></div>
            </div>

            <div class="col-sm-6">
                <label class="text-muted small">Suất chiếu</label>
                <div class="fw-bold" th:text="${#temporals.format(booking.showtime.startTime, 'HH:mm · dd/MM/yyyy')}"></div>
            </div>

            <div class="col-sm-6">
                <label class="text-muted small">Phòng chiếu</label>
                <div class="fw-bold" th:text="|${booking.showtime.room.roomName} (${booking.showtime.room.roomType.label})|"></div>
            </div>

            <div class="col-12">
                <label class="text-muted small">Danh sách ghế ngồi</label>
                <div class="d-flex flex-wrap gap-2 mt-1">
                    <span class="badge bg-dark fs-6 px-3 py-2" th:each="t : ${booking.tickets}" th:text="${t.seatCode}"></span>
                </div>
            </div>

            <div class="col-sm-6">
                <label class="text-muted small">Thời điểm đặt</label>
                <div class="small" th:text="${#temporals.format(booking.bookingDate, 'dd/MM/yyyy HH:mm:ss')}"></div>
            </div>

            <div class="col-sm-6">
                <label class="text-muted small">Tổng tiền thanh toán</label>
                <div class="h4 text-danger fw-bold mb-0" th:text="${#numbers.formatDecimal(booking.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></div>
            </div>
        </div>

        <hr class="my-4">

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/customer/bookings}">
                ← Quay lại danh sách
            </a>

            <form th:if="${booking.status.name() != 'CANCELLED'}" method="post"
                  th:action="@{/customer/bookings/{id}/cancel(id=${booking.bookingId})}"
                  onsubmit="return confirm('Bạn có chắc chắn muốn huỷ đơn vé này? (Lưu ý: Chỉ huỷ được trước giờ chiếu ít nhất 2 giờ).');" class="d-inline">
                <button class="btn btn-outline-danger">
                    Huỷ đơn vé này
                </button>
            </form>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
