<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Lịch sử đặt vé - Vé của tôi')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="cinema-card">
        <div class="cinema-card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h5 class="mb-0 fw-bold">🎟️ Lịch sử vé đã đặt của tôi</h5>
            <form class="d-flex align-items-center gap-2" method="get" th:action="@{/customer/bookings}">
                <select class="form-select form-select-sm" name="status" onchange="this.form.submit()" style="min-width: 180px;">
                    <option value="">Tất cả trạng thái</option>
                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}" th:selected="${st == status}"></option>
                </select>
            </form>
        </div>

        <div class="cinema-card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">Mã đơn</th>
                        <th>Ngày đặt</th>
                        <th>Phim</th>
                        <th>Suất chiếu & Phòng</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-3">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${bookings.empty}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <p class="mb-2">Bạn chưa có đơn đặt vé nào.</p>
                            <a class="btn btn-sm btn-primary" th:href="@{/}">Khám phá phim đang chiếu ngay</a>
                        </td>
                    </tr>
                    <tr th:each="b : ${bookings.content}">
                        <td class="ps-3 fw-bold text-primary" th:text="|#${b.bookingId}|"></td>
                        <td class="small" th:text="${#temporals.format(b.bookingDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td><strong th:text="${b.showtime.movie.title}"></strong></td>
                        <td class="small" th:text="|${#temporals.format(b.showtime.startTime, 'dd/MM/yyyy HH:mm')} · ${b.showtime.room.roomName}|"></td>
                        <td class="fw-bold text-danger" th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'COMMA', 0, 'POINT')} + 'đ'"></td>
                        <td>
                            <span class="badge" th:classappend="|badge-status-${b.status}|" th:text="${b.status}"></span>
                        </td>
                        <td class="text-end pe-3">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/customer/bookings/{id}(id=${b.bookingId})}">
                                Xem vé
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: pagination(${bookings}, ${pageUrl})}"></div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
